# JS/TS workspace packages. All frontend projects live under frontend/; the .NET projects
# under libs/<context>/{domain,application,infrastructure} are governed by the .NET solution,
# not pnpm. This lists the Angular app and feature libs (ADR-0016: @roomy/<context>-<type>).
packages:
  - 'frontend/apps/web'
  - 'frontend/libs/*'
  - 'frontend/libs/shared/*'
