<button
  *transloco="let translate"
  type="button"
  class="theme-toggle"
  [attr.aria-label]="translate(isDark() ? 'shared.theme.toLight' : 'shared.theme.toDark')"
  [attr.aria-pressed]="isDark()"
  (click)="toggle()"
>
  @if (isDark()) {
  <svg class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="4.5" fill="currentColor" />
    <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 2.5V5" />
      <path d="M12 19v2.5" />
      <path d="M2.5 12H5" />
      <path d="M19 12h2.5" />
      <path d="M5.3 5.3l1.8 1.8" />
      <path d="M16.9 16.9l1.8 1.8" />
      <path d="M18.7 5.3l-1.8 1.8" />
      <path d="M7.1 16.9l-1.8 1.8" />
    </g>
  </svg>
  } @else {
  <svg class="theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path
      d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5z"
      fill="currentColor"
    />
  </svg>
  }
</button>
