<roomy-form-field [label]="label()">
  <input
    #input
    type="text"
    role="combobox"
    autocomplete="off"
    aria-autocomplete="list"
    [attr.aria-expanded]="listboxOpen()"
    [attr.aria-controls]="listboxId"
    [attr.aria-activedescendant]="activeDescendant()"
    [placeholder]="placeholder()"
    [value]="text()"
    (input)="onInput(input.value)"
    (keydown)="onKeydown($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />
</roomy-form-field>

@if (listboxOpen()) {
<ul class="combobox__listbox" role="listbox" [id]="listboxId">
  @for (option of options(); track option.value; let index = $index) {
  <li
    class="combobox__option"
    [id]="optionId(index)"
    role="option"
    [attr.aria-selected]="index === activeIndex()"
    [class.combobox__option--active]="index === activeIndex()"
    (mousedown)="choose(option, $event)"
  >
    {{ option.label }}
  </li>
  }
</ul>
} @else if (showNoResults()) {
<p class="combobox__empty" role="status">{{ noResultsText() }}</p>
}
