<div class="tile-group">
  <span class="tile-group__label" aria-hidden="true">{{ label() }}</span>

  <div
    class="tile-group__tiles"
    [class.tile-group__tiles--vertical]="orientation() === 'vertical'"
    role="group"
    [attr.aria-label]="label()"
  >
    @for (option of options(); track option.value) {
    <button
      type="button"
      class="roomy-tile"
      [attr.aria-pressed]="option.value === value()"
      (click)="selected.emit(option.value)"
    >
      {{ option.label }}
    </button>
    }
  </div>

  <select
    #fallback
    class="tile-group__fallback"
    [attr.aria-label]="label()"
    (change)="selected.emit(fallback.value)"
  >
    @if (placeholder(); as text) {
    <option value="" [selected]="!value()">{{ text }}</option>
    } @for (option of options(); track option.value) {
    <option [value]="option.value" [selected]="option.value === value()">{{ option.label }}</option>
    }
  </select>
</div>
