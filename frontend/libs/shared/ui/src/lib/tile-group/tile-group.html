<div class="tile-group">
  <span class="tile-group__label" aria-hidden="true">{{ label() }}</span>
  <div class="tile-group__tiles" role="group" [attr.aria-label]="label()">
    @for (option of options(); track option.value) {
    <button
      type="button"
      class="tile"
      [attr.aria-pressed]="option.value === value()"
      (click)="selected.emit(option.value)"
    >
      {{ option.label }}
    </button>
    }
  </div>
</div>
