<div class="day-select">
  <span class="day-select__label" aria-hidden="true">{{ label() }}</span>

  <div class="day-select__tiles" role="group" [attr.aria-label]="label()">
    @for (option of options(); track option.value) {
    <button
      type="button"
      class="roomy-tile day-select__tile"
      [attr.aria-pressed]="option.value === value()"
      (click)="daySelected.emit(option.value)"
    >
      <span class="day-select__weekday">{{ option.weekday }}</span>
      <span class="day-select__date">{{ option.date }}</span>
    </button>
    }
  </div>

  <select
    #fallback
    class="day-select__fallback"
    [attr.aria-label]="label()"
    (change)="daySelected.emit(fallback.value)"
  >
    <option value="" [selected]="!value()">{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
    <option [value]="option.value" [selected]="option.value === value()">
      {{ option.weekday }} {{ option.date }}
    </option>
    }
  </select>
</div>
