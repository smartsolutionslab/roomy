<roomy-form-field [label]="label()">
  <select
    #control
    [value]="value()"
    [disabled]="disabled()"
    (change)="choose(control.value)"
    (blur)="markTouched()"
  >
    <option value="">{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
    <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</roomy-form-field>
