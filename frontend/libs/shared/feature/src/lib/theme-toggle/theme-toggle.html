<button
  *transloco="let translate"
  type="button"
  class="theme-toggle"
  [attr.aria-label]="translate(isDark() ? 'shared.theme.toLight' : 'shared.theme.toDark')"
  [attr.aria-pressed]="isDark()"
  (click)="toggle()"
>
  @if (isDark()) {
  <roomy-icon class="theme-toggle__icon" name="sun" />
  } @else {
  <roomy-icon class="theme-toggle__icon" name="moon" />
  }
</button>
