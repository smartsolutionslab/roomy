<ng-container *transloco="let translate">
  <button
    type="button"
    class="roomy-tile reserve__room"
    [disabled]="isFull()"
    [attr.aria-pressed]="selected()"
    (click)="chosen.emit()"
  >
    <span class="reserve__room-name">{{ room().name }}</span>
    @if (availability(); as availability) {
    <span class="reserve__room-figure">
      @if (availability.isFull) { {{ translate('attendance.reserve.full') }} } @else { {{
      translate('attendance.reserve.free', { remaining: availableSlots(), capacity: room().capacity
      }) }} }
    </span>
    <roomy-usage-bar
      class="reserve__room-meter"
      [occupied]="availability.occupied"
      [capacity]="availability.capacity"
    />
    } @else {
    <span class="reserve__room-figure"
      >{{ translate('attendance.reserve.capacityLabel', { capacity: room().capacity }) }}</span
    >
    }
  </button>
</ng-container>
