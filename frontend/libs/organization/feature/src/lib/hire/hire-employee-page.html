<ng-container *transloco="let translate">
  <section roomyPage size="form">
    <h1>{{ translate('organization.hire.title') }}</h1>
    <p>{{ translate('organization.hire.intro') }}</p>

    <form [formGroup]="hireForm" (ngSubmit)="hire()">
      <roomy-form-field [label]="translate('organization.hire.nameLabel')">
        <input type="text" formControlName="displayName" autocomplete="off" />
      </roomy-form-field>
      <roomy-field-error
        [show]="attempted() && hireForm.controls.displayName.invalid"
        [message]="translate('organization.hire.nameRequired')"
      />

      <roomy-form-field [label]="translate('organization.hire.emailLabel')">
        <input type="email" formControlName="email" autocomplete="off" />
      </roomy-form-field>
      <roomy-field-error
        [show]="attempted() && hireForm.controls.email.invalid"
        [message]="translate('organization.hire.emailInvalid')"
      />

      <roomy-select
        [label]="translate('organization.hire.roleLabel')"
        [placeholder]="translate('organization.hire.rolePlaceholder')"
        [options]="[
          { value: 'Employee', label: translate('organization.hire.roleEmployee') },
          { value: 'Administrator', label: translate('organization.hire.roleAdministrator') }
        ]"
        formControlName="role"
      />
      <roomy-field-error
        [show]="attempted() && hireForm.controls.role.invalid"
        [message]="translate('organization.hire.roleRequired')"
      />

      <roomy-form-field [label]="translate('organization.hire.passwordLabel')">
        <input type="password" formControlName="initialPassword" autocomplete="new-password" />
      </roomy-form-field>
      <roomy-field-error
        [show]="attempted() && hireForm.controls.initialPassword.invalid"
        [message]="translate('organization.hire.passwordRequired')"
      />
      <roomy-field-error [show]="invalid()" [message]="translate('organization.hire.invalid')" />
      <roomy-field-error [show]="failed()" [message]="translate('organization.hire.error')" />

      <button roomyButton variant="accent" type="submit">
        {{ translate('organization.hire.submit') }}
      </button>
    </form>

    @if (hiredName(); as name) {
    <roomy-message>{{ translate('organization.hire.started', { name: name }) }}</roomy-message>
    }
  </section>
</ng-container>
