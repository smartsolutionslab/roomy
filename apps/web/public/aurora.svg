<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMin slice">
  <defs>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="120" />
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="fadeMask">
      <rect width="1440" height="760" fill="url(#fade)" />
    </mask>
  </defs>
  <g filter="url(#blur)" mask="url(#fadeMask)" opacity="0.5">
    <circle cx="280" cy="150" r="230" fill="#fbbf24" />
    <circle cx="720" cy="60" r="230" fill="#fcd34d" />
    <circle cx="1180" cy="190" r="260" fill="#fdba74" />
    <circle cx="980" cy="400" r="220" fill="#fb923c" />
    <circle cx="480" cy="360" r="200" fill="#f97316" />
  </g>
</svg>
