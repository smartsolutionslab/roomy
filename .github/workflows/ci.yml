name: CI

# Runs the documented gate suite (CLAUDE.md "Quality gates") on every PR into
# `main` and on every push to `main`. These checks are what branch protection (#16)
# will require. Coverage thresholds (#14) and the NetArchTest architecture project
# (#13) are out of scope here and land in their own issues.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR branch cancels its in-flight run; pushes to main never cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # nrwl/nx-set-shas reads the Actions API on push to main to find the last successful run
  # (the affected base); without actions:read it gets 403 and the Nx job fails on every push.
  actions: read

# Trim CLI startup overhead across every .NET step.
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # .NET gate suite, part 1 of 2: restore, build ONCE, and run the build-only gates
  # (codegen drift, OpenAPI drift, formatting). The SDK version comes from global.json
  # (10.0.300, latestFeature). The compiled output is published as an artifact so the
  # parallel test shards (dotnet-test) run against it with --no-build — the solution is
  # compiled exactly once per CI run.
  dotnet-build:
    name: .NET build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Cache the NuGet global-packages folder so restore is warm across runs. There is no
      # central lockfile (packages are versioned inline in the csproj files), so the key is a
      # hash of every csproj plus the shared build props and the SDK pin.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Roomy.slnx

      # ONE build for the whole run. Two drift gates that would otherwise force a second
      # compile are folded into this single pass:
      #
      #  - Wolverine codegen (ADR-0034, GH-2876): the host runs from pre-generated handler
      #    code, so `codegen write` below runs --no-build against this output and we fail if
      #    it differs from what is committed.
      #  - OpenAPI spec (ADR-0036): the typed Angular client is generated from a committed
      #    spec. `OpenApiGenerateDocumentsOnBuild=true` re-emits each host's spec as part of
      #    THIS build (the csproj keeps it off by default so a local `dotnet build` needs no
      #    dummy config); we then fail if the committed spec drifts. Emitting boots each host
      #    through GetDocument, but OpenApi:EmitDocument skips the messaging runtime and the
      #    seeder, so it opens no broker or database connection — dummy config is enough.
      - name: Build (warnings as errors, emit OpenAPI specs)
        run: >
          dotnet build Roomy.slnx --configuration Release --no-restore -warnaserror
          -p:OpenApiGenerateDocumentsOnBuild=true
        env:
          OpenApi__EmitDocument: "true"
          ConnectionStrings__identity: "Host=localhost;Database=identity;Username=ci;Password=ci"
          ConnectionStrings__organization: "Host=localhost;Database=organization;Username=ci;Password=ci"
          ConnectionStrings__attendance: "Host=localhost;Database=attendance;Username=ci;Password=ci"
          ConnectionStrings__rabbitmq: "amqp://guest:guest@localhost:5672"
          Attendance__CompanyId: "00000000-0000-0000-0000-000000000001"
          Keycloak__BaseAddress: "http://localhost:8080"
          Keycloak__AdminUsername: "ci"
          Keycloak__AdminPassword: "ci"
          Keycloak__Realm: "roomy"
          DefaultAdmin__Email: "ci@roomy.local"
          DefaultAdmin__DisplayName: "CI"
          DefaultAdmin__InitialPassword: "ci-password-123"

      # The specs were emitted by the build above; fail if any committed spec drifted.
      - name: Verify the OpenAPI specs are current
        run: |
          git diff --exit-code -- apps/identity-api/Roomy.Identity.Api.json
          git diff --exit-code -- apps/organization-api/Roomy.Organization.Api.json
          git diff --exit-code -- apps/attendance-api/Roomy.Attendance.Api.json

      # Regenerate the Wolverine handler code (--no-build, reusing the build above) and fail
      # if it differs from what is committed, so a handler or Wolverine-config change without
      # re-running `codegen write` cannot reach production (where there is no runtime compiler).
      - name: Verify Wolverine codegen is current
        run: |
          dotnet run --project apps/identity-api --configuration Release --no-build -- codegen write
          git diff --exit-code -- apps/identity-api/Internal/Generated
          dotnet run --project apps/organization-api --configuration Release --no-build -- codegen write
          git diff --exit-code -- apps/organization-api/Internal/Generated
          dotnet run --project apps/attendance-api --configuration Release --no-build -- codegen write
          git diff --exit-code -- apps/attendance-api/Internal/Generated
        env:
          ConnectionStrings__identity: "Host=localhost;Database=identity;Username=ci;Password=ci"
          ConnectionStrings__organization: "Host=localhost;Database=organization;Username=ci;Password=ci"
          ConnectionStrings__attendance: "Host=localhost;Database=attendance;Username=ci;Password=ci"
          ConnectionStrings__rabbitmq: "amqp://guest:guest@localhost:5672"
          Keycloak__BaseAddress: "http://localhost:8080"
          Keycloak__AdminUsername: "ci"
          Keycloak__AdminPassword: "ci"
          Keycloak__Realm: "roomy"
          Company__Name: "Roomy"
          Attendance__CompanyId: "0199a0b0-0000-7000-8000-000000000001"
          DefaultAdmin__Email: "ci@roomy.local"
          DefaultAdmin__DisplayName: "CI"
          DefaultAdmin__InitialPassword: "ci-password-123"

      - name: Verify formatting
        run: dotnet format Roomy.slnx --verify-no-changes --no-restore

      # Publish the compiled output so the test shards run --no-build against it. bin + obj
      # together carry everything `dotnet test --no-build` needs (assemblies plus the restore
      # markers and project.assets.json under obj). Kept one day — it is only a CI relay.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build
          path: |
            **/bin/Release/**
            **/obj/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # .NET gate suite, part 2 of 2: run every test project, sharded so the slow integration
  # suites (each boots its own Aspire AppHost + Postgres) run on their own runners in
  # parallel instead of serially behind one another. Each shard reuses the dotnet-build
  # output with --no-build and collects coverage; CoverageGate.props still enforces the 85%
  # domain+application floor inside the gated projects (ADR-0022), wherever they run here.
  dotnet-test:
    name: .NET tests (${{ matrix.shard }})
    needs: dotnet-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # All fast (non-integration) assemblies on one runner. Includes the gated
          # domain+application unit suites, so the coverage floor is enforced here.
          - shard: unit
            projects: >-
              tests/architecture/Roomy.ArchitectureTests/Roomy.ArchitectureTests.csproj
              tests/identity/Roomy.Identity.Tests.csproj
              tests/organization/Roomy.Organization.Tests.csproj
              tests/attendance/Roomy.Attendance.Tests.csproj
              tests/apphost/Roomy.AppHost.Tests.csproj
              apps/gateway/tests/Roomy.Gateway.Tests.csproj
              libs/shared-kernel/tests/Roomy.SharedKernel.Tests.csproj
              libs/infrastructure-messaging/tests/Roomy.Infrastructure.Messaging.Tests.csproj
              libs/infrastructure-persistence/tests/Roomy.Infrastructure.Persistence.Tests.csproj
          - shard: identity-integration
            projects: tests/identity-integration/Roomy.Identity.IntegrationTests.csproj
          - shard: organization-integration
            projects: tests/organization-integration/Roomy.Organization.IntegrationTests.csproj
          - shard: attendance-integration
            projects: tests/attendance-integration/Roomy.Attendance.IntegrationTests.csproj
          # The provisioning-saga e2e boots the full stack (Postgres x2 + RabbitMQ + Keycloak +
          # both API hosts), so it gets its own runner to avoid contending for Docker containers
          # with the other integration fixtures (ADR-0041; e2e tier, ADR-0022). Its app host
          # carries fixed test credentials, so it needs no extra environment. Not coverage-gated.
          - shard: saga-e2e
            projects: tests/saga-e2e/Roomy.Saga.E2ETests.csproj
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build

      # Run each project in the shard against the prebuilt output. `--collect "XPlat Code
      # Coverage"` with coverlet.runsettings reports coverage per project (policy exclusions
      # applied); the merge-blocking floor is enforced by CoverageGate.props inside the gated
      # projects, not here.
      - name: Test (with coverage)
        run: |
          for project in ${{ matrix.projects }}; do
            echo "::group::dotnet test $project"
            dotnet test "$project" --configuration Release --no-build \
              --collect "XPlat Code Coverage" \
              --settings coverlet.runsettings \
              --results-directory "${{ runner.temp }}/coverage"
            echo "::endgroup::"
          done

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 1

  # Human-readable coverage summary merged across all shards, in the job log + step summary.
  # Reporting only — the merge-blocking floor is CoverageGate.props inside the test step above.
  coverage:
    name: Coverage report
    needs: dotnet-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The report tool is pinned in .config/dotnet-tools.json; cache its package so
      # `dotnet tool restore` is warm instead of downloading on every run.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Download coverage from all shards
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/coverage
          pattern: coverage-*
          merge-multiple: true

      - name: Restore tools
        run: dotnet tool restore

      - name: Coverage report
        run: |
          dotnet reportgenerator \
            "-reports:${{ runner.temp }}/coverage/**/coverage.cobertura.xml" \
            "-targetdir:${{ runner.temp }}/coverage-report" \
            "-reporttypes:TextSummary;MarkdownSummaryGithub"
          cat "${{ runner.temp }}/coverage-report/Summary.txt"
          cat "${{ runner.temp }}/coverage-report/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

  # JS/TS gate suite via Nx. nx-set-shas computes the affected base/head; on PRs
  # that is the merge base with the PR's base branch, on push to main it is the
  # last successful commit on main. Targets that a project does not define (test,
  # build are not present yet) are simply skipped by Nx.
  nx:
    name: Nx affected gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so nx-set-shas can resolve the affected base SHA.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reuse Nx's computation cache across runs so unaffected lint/test/build results are
      # replayed instead of recomputed. Keyed per-commit with a fallback to the latest cache.
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      # Regenerate the typed client from the committed OpenAPI spec and fail if it differs from what
      # is committed (ADR-0036). Pure Node — no app, database or .NET needed — so a spec change that
      # was not followed by re-running generate-client cannot drift the client the frontend consumes.
      - name: Verify the generated API client is current
        run: |
          pnpm nx run identity-data-access:generate-client
          git diff --exit-code -- libs/identity/data-access/src/lib/generated
          pnpm nx run organization-data-access:generate-client
          git diff --exit-code -- libs/organization/data-access/src/lib/generated
          pnpm nx run attendance-data-access:generate-client
          git diff --exit-code -- libs/attendance/data-access/src/lib/generated

      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Lint, test, build affected projects
        run: pnpm nx affected -t lint test build

  # Conventional Commits check across the PR's commit range (issue #11 config).
  # Only meaningful on pull_request, where a base and head SHA bound the range.
  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # All commits in the PR range must be present to lint each of them.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit range
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
