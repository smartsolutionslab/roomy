name: CI

# Runs the documented gate suite (CLAUDE.md "Quality gates") on every PR into
# `main` and on every push to `main`. These checks are what branch protection (#16)
# will require. Coverage thresholds (#14) and the NetArchTest architecture project
# (#13) are out of scope here and land in their own issues.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR branch cancels its in-flight run; pushes to main never cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # nrwl/nx-set-shas reads the Actions API on push to main to find the last successful run
  # (the affected base); without actions:read it gets 403 and the Nx job fails on every push.
  actions: read

jobs:
  # .NET gate suite: restore, build with warnings-as-errors, test, and verify
  # formatting. The SDK version comes from global.json (10.0.300, latestFeature).
  dotnet:
    name: .NET gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Roomy.slnx

      - name: Build (warnings as errors)
        run: dotnet build Roomy.slnx --configuration Release --no-restore -warnaserror

      # Wolverine runs from pre-generated code instead of compiling at runtime (ADR-0034, GH-2876).
      # Regenerate the handler code and fail if it differs from what is committed, so a handler or
      # Wolverine-config change without re-running `codegen write` cannot reach production (where there
      # is no runtime compiler). `codegen write` builds the host's Wolverine model offline — it opens no
      # broker or database connection — so dummy config is enough to satisfy the host's startup guards.
      - name: Verify Wolverine codegen is current
        run: |
          dotnet run --project apps/identity-api --configuration Release --no-build -- codegen write
          git diff --exit-code -- apps/identity-api/Internal/Generated
        env:
          ConnectionStrings__identity: "Host=localhost;Database=identity;Username=ci;Password=ci"
          ConnectionStrings__rabbitmq: "amqp://guest:guest@localhost:5672"
          Keycloak__BaseAddress: "http://localhost:8080"
          Keycloak__AdminUsername: "ci"
          Keycloak__AdminPassword: "ci"
          Keycloak__Realm: "roomy"
          DefaultAdmin__Email: "ci@roomy.local"
          DefaultAdmin__DisplayName: "CI"
          DefaultAdmin__InitialPassword: "ci-password-123"

      # Runs every test project and, in the same pass, enforces the coverage gate.
      # `--collect "XPlat Code Coverage"` with coverlet.runsettings collects and reports
      # coverage per project (policy exclusions applied). The 85% line+branch FLOOR on
      # domain + application (ADR-0022, docs/testing-strategy.md) is enforced inside the
      # gated test projects themselves: each imports tests/coverage/CoverageGate.props,
      # whose Coverlet MSBuild threshold fails `dotnet test` below the floor. Shared
      # primitives, infrastructure and UI are reported here but not gated, per policy.
      - name: Test (with coverage)
        run: >
          dotnet test Roomy.slnx --configuration Release --no-build
          --collect "XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory ${{ runner.temp }}/coverage

      # Human-readable coverage summary in the job log + step summary. Reporting only —
      # the merge-blocking floor is the step above.
      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            "-reports:${{ runner.temp }}/coverage/**/coverage.cobertura.xml" \
            "-targetdir:${{ runner.temp }}/coverage-report" \
            "-reporttypes:TextSummary;MarkdownSummaryGithub"
          cat "${{ runner.temp }}/coverage-report/Summary.txt"
          cat "${{ runner.temp }}/coverage-report/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify formatting
        run: dotnet format Roomy.slnx --verify-no-changes

  # JS/TS gate suite via Nx. nx-set-shas computes the affected base/head; on PRs
  # that is the merge base with the PR's base branch, on push to main it is the
  # last successful commit on main. Targets that a project does not define (test,
  # build are not present yet) are simply skipped by Nx.
  nx:
    name: Nx affected gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so nx-set-shas can resolve the affected base SHA.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Lint, test, build affected projects
        run: pnpm nx affected -t lint test build

  # Conventional Commits check across the PR's commit range (issue #11 config).
  # Only meaningful on pull_request, where a base and head SHA bound the range.
  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # All commits in the PR range must be present to lint each of them.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit range
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
